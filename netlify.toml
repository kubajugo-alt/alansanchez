[build]
  publish = "."
  command = "node scripts/build-manifest.mjs"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/voice/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
