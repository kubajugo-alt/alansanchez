<!doctype html>
<meta charset="utf-8">
<title>Cave 6 redesign mock</title>
<style>body { margin: 0; background: #111; } canvas { display: block; margin: 0 0 8px; }</style>
<body>
<canvas id="a" width="1280" height="720"></canvas>
<canvas id="b" width="1280" height="720"></canvas>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Cave 6, laid out by code before any painting (the user, 2026-10-30: "There is one small opening in the ceiling. The
// beam of light goes through it directly into the hole in the floor. And there, at this hole (which will need a close
// up), there are 7 discs that reflect the light... 6 discs direct the light through a path on the smaller triangles.
// The 7th is reached by the light last, and it lands on the big triangle").
// Two views: A the cave (the dome, the small opening, the beam into the hole, the great triangle); B/C the hole, close.
const CLEAN = location.search.includes('clean');
function label(g, x, y, t, o = {}) { if (CLEAN) return; g.save(); g.font = (o.big ? '700 22px' : '600 15px') + ' sans-serif'; const w = g.measureText(t).width + 14;
  g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(x - w / 2, y - 13, w, 24); g.fillStyle = o.fg || '#ffe9b0'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, x, y); g.restore(); }
function title(g, t, s) { if (CLEAN) return; g.save(); g.fillStyle = 'rgba(0,0,0,0.8)'; g.fillRect(0, 0, 1280, 60); g.fillStyle = '#fff'; g.font = '700 22px sans-serif'; g.fillText(t, 16, 26);
  g.fillStyle = '#d8c9a8'; g.font = '15px sans-serif'; g.fillText(s, 16, 48); g.restore(); }
function poly(g, P, fill, stroke, lw) { g.save(); g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 3; g.stroke(); } g.restore(); }
function tri(g, x, y, s, fill, lit) { poly(g, [[x - s, y - s * 0.8], [x + s, y - s * 0.8], [x, y + s * 0.9]], lit ? 'rgba(255,214,120,0.95)' : fill, 'rgba(40,24,10,0.6)', 2);
  if (lit) { const gr = g.createRadialGradient(x, y, 2, x, y, s * 2.4); gr.addColorStop(0, 'rgba(255,220,140,0.6)'); gr.addColorStop(1, 'rgba(255,220,140,0)'); g.fillStyle = gr; g.fillRect(x - s * 3, y - s * 3, s * 6, s * 6); } }
function beam(g, pts, w) { g.save(); g.strokeStyle = 'rgba(255,226,140,0.85)'; g.lineWidth = w || 10; g.lineCap = 'round'; g.shadowColor = 'rgba(255,220,130,0.9)'; g.shadowBlur = 18;
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore(); }
function disc(g, x, y, r, set, n) { g.save(); const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r); gr.addColorStop(0, set ? 'rgba(170,180,190,1)' : 'rgba(60,40,22,1)');
  gr.addColorStop(0.4, set ? 'rgba(20,20,26,1)' : 'rgba(80,56,30,1)'); gr.addColorStop(1, set ? 'rgba(4,4,6,1)' : 'rgba(120,84,44,1)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = 'rgba(30,18,8,0.9)'; g.lineWidth = 3; g.stroke(); g.restore(); if (n) label(g, x, y - r - 14, n, { fg: '#cfe2ff' }); }

// ------------------------------------------------------------ A: the cave
function cave(g) {
  g.fillStyle = '#7a5530'; g.fillRect(0, 0, 1280, 720);
  // the dome: banded tuff, closing in to a small opening up and to the right
  for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#8e6538' : '#a87a46'; g.beginPath(); g.ellipse(640, -140 + i * 28, 1000 - i * 60, 520 - i * 40, 0, 0, Math.PI); g.fill(); }
  // the back wall, the bench, the floor
  poly(g, [[0, 260], [1280, 260], [1280, 470], [0, 470]], '#9a6f3e');
  poly(g, [[180, 470], [1100, 470], [1140, 500], [140, 500]], '#7e5a32');
  poly(g, [[0, 500], [1280, 500], [1280, 720], [0, 720]], '#b48a52');
  // the arch out to the sea of cloud (left), as now
  poly(g, [[40, 500], [40, 200], [120, 140], [210, 200], [210, 500]], '#cfe0ee'); poly(g, [[40, 380], [210, 380], [210, 500], [40, 500]], '#f2f2f2');
  // the great triangle on the back wall; the rows of small ones either side
  poly(g, [[540, 215], [820, 215], [680, 450]], '#7e5a32', 'rgba(40,24,10,0.7)', 3);
  for (let i = 0; i < 4; i++) tri(g, 300 + i * 62, 360, 20, '#7e5a32');
  for (let i = 0; i < 7; i++) tri(g, 820 + i * 66, 360, 20, '#7e5a32');
  // the small opening: one, small, in the dome to the upper right (a channel slanting through the rock to the cliff face)
  poly(g, [[930, 70], [968, 64], [972, 92], [934, 98]], '#e8f0ff', '#3a2610', 3);
  label(g, 1060, 70, 'one small opening (a slanting channel through the rock, to the east)');
  // the hole in the floor, and the beam: straight in from the opening to the hole at the turning sunrise
  g.save(); g.fillStyle = '#1a1008'; g.beginPath(); g.ellipse(640, 600, 170, 46, 0, 0, 7); g.fill(); g.strokeStyle = '#5a3c1e'; g.lineWidth = 8; g.stroke(); g.restore();
  beam(g, [[950, 82], [660, 596]], 14);
  label(g, 640, 680, 'the hole in the floor: steps down to the lower chamber, where the discs are');
  label(g, 830, 330, 'San Juan sunrise: the beam goes straight into the hole', { fg: '#ffe0a0' });
  // the last of the seven throws it up out of the hole onto the great triangle
  beam(g, [[700, 590], [680, 340]], 7);
  tri(g, 680, 330, 26, '#7e5a32', true);
  label(g, 560, 300, 'the 7th disc throws it onto the great triangle', { fg: '#ffe0a0' });
  label(g, 125, 120, 'the way out (as now)', { fg: '#c9f5c9' });
  title(g, 'A · CAVE 6 · the room', 'One small opening. No ring of sockets in the roof, no ladder. The discs are in the chamber below the hole.');
}

// ------------------------------------------------------------ B/C: the lower chamber (the user: "an extra room - the
// lower part of the cave, where the disks are"; "the light should be hitting the disks individually, otherwise taking
// one out breaks the seal completely"; "they should be placed in a circle at the bottom of the hole"): a low round room
// under the cave floor, down rock steps through the hole. On its floor, round the door, a ring of seven sockets. As the
// sun rises the spot of light from the hole travels round the ring like a sundial's shadow and meets each disc in turn;
// I-VI each throw it up onto their own small triangle on the chamber wall; VII, last, up through the hole onto the great
// triangle. A disc missing: at that moment the light falls on bare stone, and that word of the sentence goes unread.
const C = [640, 600], RX = 360, RY = 78;
const ANG = [180, 129, 77, 26, -26, -77, -129];   // I-VII evenly round the ring (degrees, 0 = right, 90 = far side), the light's order
const S = ANG.map(a => [C[0] + RX * Math.cos(a * Math.PI / 180), C[1] - RY * Math.sin(a * Math.PI / 180)]);
const TRI = [[170, 300], [330, 270], [500, 250], [780, 250], [950, 270], [1110, 300]];   // the small triangles on the wall
function lower(g, phase) {
  g.fillStyle = '#5a3e22'; g.fillRect(0, 0, 1280, 720);
  for (let i = 0; i < 5; i++) { g.fillStyle = i % 2 ? '#6e4c2a' : '#7c5630'; g.beginPath(); g.ellipse(640, 520, 760 - i * 30, 440 - i * 30, 0, Math.PI, 0); g.fill(); }
  poly(g, [[0, 0], [1280, 0], [1280, 110], [0, 110]], '#4a3219');
  g.save(); g.fillStyle = '#f4e2b0'; g.beginPath(); g.ellipse(640, 92, 110, 30, 0, 0, 7); g.fill(); g.strokeStyle = '#2a1a0c'; g.lineWidth = 6; g.stroke(); g.restore();
  label(g, 640, 46, 'the hole up into the cave: the beam comes down through it');
  for (let i = 0; i < 5; i++) poly(g, [[1120 + i * 22, 640 - i * 90], [1280, 640 - i * 90], [1280, 672 - i * 90], [1120 + i * 22, 672 - i * 90]], '#8e6538', 'rgba(40,24,10,0.5)', 2);
  label(g, 1180, 700, 'steps up to the hole', { fg: '#c9f5c9' });
  poly(g, [[0, 500], [1280, 500], [1280, 720], [0, 720]], '#6a4a28');
  // the door in the middle of the floor, the ring of sockets round it
  g.save(); g.fillStyle = '#120a05'; g.beginPath(); g.ellipse(C[0], C[1], 150, 34, 0, 0, 7); g.fill(); g.strokeStyle = '#3a2410'; g.lineWidth = 6; g.stroke();
  g.strokeStyle = 'rgba(40,24,10,0.5)'; g.lineWidth = 3; g.setLineDash([8, 8]); g.beginPath(); g.ellipse(C[0], C[1], RX, RY, 0, 0, 7); g.stroke(); g.restore();
  label(g, C[0], C[1], 'the door: the water comes up here', { fg: '#cfe2ff' });
  const names = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'], T = ['06:52', '06:56', '07:00', '07:04', '07:07', '07:10', '07:12'];
  TRI.forEach(([x, y], i) => tri(g, x, y, 20, '#5e4024', phase === 'lit' || (phase === 'sat' && i === 5)));
  S.forEach(([x, y], i) => {
    const set = phase === 'sat' ? i >= 5 : true;
    g.save(); g.globalAlpha = 0.45; beam(g, [[640, 96], [x, y]], 4); g.restore();   // the beam, at that moment
    if (set) beam(g, i < 6 ? [[x, y], TRI[i]] : [[x, y], [640, 96]], i < 6 ? 4 : 6);
    disc(g, x, y, 20, set, names[i]);
    label(g, x, y + 34, T[i], { fg: '#d8c9a8' });
  });
  if (phase === 'sat') {
    label(g, 640, 180, 'Saturday: I-V gone; as the spot reaches their sockets it lies on bare stone; those triangles stay dark', { fg: '#ffe0a0' });
    label(g, 640, 210, 'only VI lights its triangle; VII (Baute\'s) still turned to the door', { fg: '#ffe0a0' });
  } else {
    label(g, 640, 180, 'as the sun rises the spot goes round the ring: each disc in turn throws it onto its own small triangle', { fg: '#ffe0a0' });
    label(g, 640, 210, 'VII, last (07:12): up through the hole onto the great triangle', { fg: '#ffe0a0' });
    g.save(); g.fillStyle = 'rgba(20,40,46,0.6)'; g.beginPath(); g.ellipse(C[0], C[1], RX + 60, RY + 40, 0, 0, 7); g.fill(); g.restore();
    label(g, 640, 690, 'Monday: Alan kneels in the ring as the water comes up out of the door; Vasco at the hole above, calling', { fg: '#bfe6ff' });
  }
  title(g, phase === 'sat' ? 'B · THE LOWER CHAMBER · Saturday (Vasco)' : 'C · THE LOWER CHAMBER · Monday (Alan)',
    'Under the cave floor, down steps through the hole: seven sockets in a ring on the floor, round the door; a sundial for one sunrise.');
}
cave(document.getElementById('a').getContext('2d'));
lower(document.getElementById('b').getContext('2d'), 'sat');
lower(document.getElementById('c').getContext('2d'), 'lit');
document.title = 'ready';
</script>
